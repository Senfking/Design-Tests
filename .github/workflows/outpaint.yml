name: outpaint-cars

# Runs the scrape + Stability outpaint pipeline on a GitHub runner
# (the sandboxed Claude Code env can't reach api.stability.ai or the
# MB MENA CDN). Trigger from the Actions tab; artifact "outpainted"
# contains report.html (open in a browser) + results.json + the PNGs.

on:
  push:
    branches: [claude/adoring-feynman-lr3Ip]
    paths:
      - "scratch/**"
      - ".github/workflows/outpaint.yml"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Listing URL to scrape"
        required: false
        default: "https://www.mercedes-benz-mena.com/dubai/en/buy-new/?manufacturer%5B0%5D=Mercedes-Benz&model%5B0%5D=C-Class&nfcSearchVersion=1.0.0"
      num_images:
        description: "How many vehicles to outpaint"
        required: false
        default: "2"
      prompt:
        description: "Outpaint guidance"
        required: false
        default: "luxury sedan photographed in a modern showroom, soft studio lighting, matching background, photorealistic, no additional cars"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install --quiet requests pillow

      - name: Install Playwright + Chromium
        working-directory: scratch
        run: |
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Scrape vehicle cards
        working-directory: scratch
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://www.mercedes-benz-mena.com/dubai/en/buy-new/?manufacturer%5B0%5D=Mercedes-Benz&model%5B0%5D=C-Class&nfcSearchVersion=1.0.0' }}
        run: |
          node scrape.mjs > vehicles.json
          echo "--- vehicles.json ---"
          python3 -c "import json; v=json.load(open('vehicles.json')); print(f'{len(v)} cards'); print(json.dumps(v[:3], indent=2))"

      - name: Pick top N vehicles, clean model name
        working-directory: scratch
        env:
          N: ${{ inputs.num_images || '2' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.parse import unquote

          n = int(os.environ["N"])
          vehicles = json.load(open("vehicles.json"))

          def clean_model(v: dict) -> str:
              # JSON-LD concatenates fields ("Mercedes-BenzC-ClassC 200Available"),
              # so prefer the stock URL slug when present.
              m = re.search(r"/stock/\d+-(.+?)/", v.get("url") or "")
              if m:
                  return unquote(m.group(1)).replace("-", " ").strip()
              return (v.get("model") or "").strip()

          picked = []
          for v in vehicles:
              if not (v.get("url") or "").startswith("http"):
                  continue
              v = dict(v)
              v["model"] = clean_model(v)
              picked.append(v)
              if len(picked) >= n:
                  break

          json.dump(picked, open("picked.json", "w"), indent=2)
          print(f"picked {len(picked)}:")
          for v in picked:
              print(f"  - {v['model']!r} | {v.get('price')!r}")
              print(f"      url:   {v.get('url')}")
          if not picked:
              raise SystemExit("no vehicles — see vehicles.json artifact")
          PY

      - name: Enrich with full-res hero image from each detail page
        working-directory: scratch
        run: |
          node enrich.mjs
          echo "--- picked.json after enrich ---"
          cat picked.json

      - name: Outpaint to 1:1
        working-directory: scratch
        env:
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          PROMPT: ${{ inputs.prompt || 'luxury sedan photographed in a modern showroom, soft studio lighting, matching background, photorealistic, no additional cars' }}
        run: |
          if [ -z "$STABILITY_API_KEY" ]; then
            echo "::error::Set the STABILITY_API_KEY repo secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          mapfile -t URLS < <(python3 -c "import json; [print(v['image']) for v in json.load(open('picked.json'))]")
          python3 outpaint.py "${URLS[@]}" --out out --prompt "$PROMPT"
          ls -la out

      - name: Build report
        working-directory: scratch
        run: |
          python3 build_report.py --picked picked.json --out-dir out \
            --results results.json --report report.html
          echo "--- results.json ---"
          cat results.json

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outpainted
          path: |
            scratch/report.html
            scratch/results.json
            scratch/vehicles.json
            scratch/picked.json
            scratch/out/**
          if-no-files-found: warn
